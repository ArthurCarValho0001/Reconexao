<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#23594d">
<meta name="description" content="Reconexão I — sua jornada de autoconhecimento, aulas, encontros e comunidade.">
<title>Reconexão I | Sua jornada começa aqui</title>
<style>
:root{--forest:#23594d;--forest2:#153a32;--mint:#e7f1e8;--cream:#f8f7f2;--line:#dae6db;--gold:#cba66b;--text:#263e35}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{border:0;border-radius:10px;padding:12px 19px;color:white;background:var(--forest);cursor:pointer;font-weight:650}button:hover{filter:brightness(.95)}button:focus-visible{outline:3px solid var(--gold)}button.ghost{color:var(--forest);background:var(--mint)}header{position:sticky;top:0;z-index:5;background:#fffefaed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px max(4%,calc((100vw - 1180px)/2));gap:12px;flex-wrap:wrap}.brand{font:700 29px Georgia,serif;letter-spacing:-1.5px;color:var(--forest)}.brand span{color:var(--gold)}.header-actions{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1160px;margin:28px auto;padding:0 20px 85px}.hero{background:linear-gradient(115deg,#163b33 0%,#286956 73%,#4b9278 100%);color:white;padding:86px 7%;border-radius:24px;position:relative;overflow:hidden}.hero:after{content:"✺";font-size:350px;position:absolute;right:-50px;top:-130px;opacity:.07}.hero>*{position:relative;z-index:1}.hero h1{font:normal clamp(36px,5vw,67px)/1.12 Georgia,serif;max-width:730px;margin:19px 0}.hero p{font-size:19px;max-width:560px}.hero button{background:#fff;color:var(--forest)}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:750;text-transform:uppercase}.section{margin:50px 0}.section h2{font:normal 35px Georgia,serif;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:16px;background:white;padding:24px;margin:13px 0;box-shadow:0 7px 30px #20412a08}.card h3{margin:0 0 9px}.card p,.muted{color:#687f74}.big-num{font-size:35px;color:var(--forest);font-weight:800}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:28px}.sidebar{background:white;border:1px solid var(--line);padding:12px;border-radius:15px;position:sticky;top:90px;align-self:start}.sidebar button{width:100%;display:block;text-align:left;margin:3px 0;background:transparent;color:var(--forest)}.sidebar button.active{background:var(--mint)}.notice{background:var(--mint);padding:19px;border-radius:13px}.video{background:linear-gradient(130deg,#1b4a3e,#8ab4a2);color:white;height:270px;display:grid;place-items:center;font-size:70px;border-radius:14px}label{display:block;font-weight:650;margin-top:8px}input,textarea,select{display:block;width:100%;font:inherit;padding:12px;border:1px solid #cbd8cf;border-radius:9px;margin:6px 0 15px}textarea{min-height:110px}.tag{display:inline-block;background:var(--mint);border-radius:30px;padding:5px 11px;font-size:12px;color:var(--forest);font-weight:650}.bottom{text-align:center;font-size:12px;color:#809084;padding:25px}.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.person{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:790px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto}.sidebar button{white-space:nowrap}.grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid,.grid.four{grid-template-columns:1fr}.hero{padding:48px 26px}header{padding:12px 15px}}
</style>
</head>
<body>
<header><div class="brand">reconexão<span>.</span></div><div class="header-actions"><button class="ghost" onclick="go('public')">Conhecer</button><button class="ghost" onclick="go('student')">Área do aluno</button><button onclick="go('admin')">Painel admin</button></div></header>
<main id="app"></main>
<footer class="bottom">PROTÓTIPO PARA APRESENTAÇÃO • Todos os dados são fictícios. Não há autenticação, pagamentos ou envios reais.</footer>
<script>
let role="public",page="home";const booked=new Set(),app=document.querySelector("#app");
const notices=["Encontro semanal confirmado para quinta-feira, às 19h.","Novo material disponível no módulo de autoconhecimento."];
const menus={student:[["home","Visão geral"],["classes","Videoaulas"],["meetings","Reuniões"],["groups","Encontros"],["notices","Avisos"],["account","Meu acesso"]],admin:[["home","Dashboard"],["classes","Módulos e aulas"],["meetings","Reuniões"],["groups","Encontros"],["notices","Avisos"],["emails","E-mails"]]};
function button(label,action,ghost=false){return '<button '+(ghost?'class="ghost" ':'')+'onclick="'+action+'">'+label+'</button>'}
function go(r,p="home"){role=r;page=p;render();window.scrollTo(0,0)}
function simulated(name){alert(name+" — esta operação é apenas uma demonstração visual.")}
function card(title,description,action=""){return '<article class="card"><h3>'+title+'</h3><p>'+description+'</p>'+action+'</article>'}
function frame(title,subtitle,body){app.innerHTML='<div class="layout"><nav class="sidebar" aria-label="Menu">'+menus[role].map(([p,label])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+role+'\',\''+p+'\')">'+label+'</button>').join("")+'</nav><section><h1>'+title+'</h1><p class="muted">'+subtitle+'</p>'+body+'</section></div>'}
function demoForm(title,fields){return '<article class="card"><h2>'+title+'</h2>'+fields.map(x=>'<label>'+x+'</label><input placeholder="'+x+'">').join("")+button("Salvar (simulação)","simulated('Cadastro')")+'</article>'}
function render(){
if(role==="public"){
if(page==="checkout") app.innerHTML='<article class="card" style="max-width:620px;margin:55px auto"><span class="tag">Reconexão I</span><h1>Sua jornada começa aqui</h1><p>Pagamento único com acesso por seis meses. Valor a definir.</p><label>Nome completo</label><input placeholder="Seu nome"><label>E-mail</label><input type="email" placeholder="Seu e-mail">'+button("Simular pagamento aprovado","go('public','success')")+'</article>';
else if(page==="success")app.innerHTML=card("Pagamento aprovado — demonstração","No produto real, após a confirmação do gateway, um e-mail permitirá a definição da senha e ativação do acesso.",button("Conhecer o portal do aluno","go('student')"));
else app.innerHTML='<section class="hero"><div class="eyebrow">RECONEXÃO I • COMUNIDADE E APRENDIZAGEM</div><h1>O primeiro passo de um novo caminho começa em você.</h1><p>Um espaço acolhedor para aprender, compartilhar e se reconectar. Videoaulas, encontros e pessoas caminhando ao seu lado.</p>'+button("Quero fazer parte","go('public','checkout')")+'</section><section class="section"><span class="eyebrow">O QUE VOCÊ ENCONTRA AQUI</span><h2>Uma jornada acompanhada de perto</h2><div class="grid">'+card("✦ Aprenda no seu ritmo","Videoaulas organizadas por módulos e materiais de apoio.")+card("◌ Encontros que aproximam","Reuniões semanais pelo Google Meet e gravações disponíveis depois.")+card("♡ Uma comunidade de apoio","Rodas de conversa em grupos menores e grupo no WhatsApp.")+'</div></section><section class="section">'+card("Reconexão I • seis meses de acesso","Contratação única, sem mensalidade recorrente. Ao final do período, o aluno poderá renovar. Reconexão II e III ficam para o futuro.",button("Fazer parte da comunidade","go('public','checkout')"))+'</section>';
}else if(role==="student"){
if(page==="home")frame("Bem-vindo ao Reconexão","Este é o seu espaço de aprendizado e comunidade.",'<div class="notice">✦ Reconexão I • Acesso ativo • Validade demonstrativa: 15/04/2027</div><div class="grid">'+card("Continue aprendendo","Explore seus módulos.",button("Ver aulas","go('student','classes')"))+card("Próxima reunião","Quinta-feira, às 19h.",button("Ver detalhes","go('student','meetings')"))+card("Encontros em grupo","Reserve sua vaga.",button("Explorar encontros","go('student','groups')"))+'</div>'+card("Comunidade no WhatsApp","Acesse o grupo da comunidade pelo link disponibilizado pela equipe.",button("Abrir WhatsApp","simulated('Link do grupo')")));
else if(page==="classes")frame("Videoaulas","Conteúdos organizados para sua jornada.",["Boas-vindas e introdução","Autoconhecimento","Construindo novos caminhos"].map((x,i)=>card("Módulo "+(i+1)+" • "+x,"Duas aulas ilustrativas e materiais complementares.",button("Assistir aula","go('student','video')"))).join(""));
else if(page==="video")frame("Videoaula","Módulo 1 — Boas-vindas",'<article class="card"><div class="video">▶</div><h2>Boas-vindas ao Reconexão</h2><p>O player definitivo será incorporado de um serviço de hospedagem de vídeo externo.</p>'+button("Simular reprodução","simulated('Vídeo')")+'</article>');
else if(page==="meetings")frame("Reuniões ao vivo","Encontros e gravações anteriores.",card("Próxima reunião — quinta-feira às 19h","Acesso pelo Google Meet.",button("Participar","simulated('Link do Google Meet')"))+card("Biblioteca de gravações","Reveja encontros anteriores quando desejar.",button("Assistir gravação","simulated('Gravação')")));
else if(page==="groups")frame("Encontros em grupo","Vagas limitadas e inscrição por encontro.",[0,1,2].map(i=>card("Roda de conversa • Grupo "+(i+1),"Data ilustrativa • 19h • "+(i===2?"Vagas esgotadas":"Capacidade: 8 pessoas"),i===2?'<span class="tag">Esgotado</span>':button(booked.has(i)?"Cancelar inscrição":"Reservar vaga","toggle("+i+")"))).join(""));
else if(page==="notices")frame("Avisos","Comunicados da comunidade.",notices.map(x=>card("Comunicado",x)).join(""));
else frame("Meu acesso","Acompanhe sua participação.",card("Reconexão I","Acesso por seis meses após a confirmação do pagamento. Apenas uma sessão ativa por conta na versão final.",button("Simular renovação","go('public','checkout')")));
}else{
if(page==="home")frame("Painel administrativo","Acompanhamento da comunidade — dados ilustrativos.",'<div class="grid four">'+[["Alunos ativos",152],["Sem login recente",18],["Acesso expirado sem renovação",23],["Novas inscrições",12]].map(x=>'<div class="card"><p>'+x[0]+'</p><div class="big-num">'+x[1]+'</div></div>').join("")+'</div>'+card("Presenças e ausências","85 inscritos nos encontros • 68 presentes • 17 ausentes.")+card("Gestão de conteúdos","Use o menu para simular cadastros de aulas, reuniões, encontros e comunicados."));
else if(page==="classes")frame("Módulos e aulas","Cadastre e organize o conteúdo.",demoForm("Adicionar videoaula",["Título da aula","Módulo","Link do vídeo externo"])+card("Conteúdos existentes","Boas-vindas • Autoconhecimento • Construindo novos caminhos."));
else if(page==="meetings")frame("Reuniões","Agende lives e cadastre gravações manualmente.",demoForm("Nova reunião",["Título","Data e horário","Link do Google Meet"])+demoForm("Adicionar gravação",["Título da gravação","Link do vídeo"]));
else if(page==="groups")frame("Encontros","Defina participantes e registre presenças.",demoForm("Criar encontro",["Título","Data e horário","Limite de vagas"])+card("Grupo A — lista de inscritos","Marina, João, Ana e Carlos (nomes fictícios).",button("Registrar presença","go('admin','attendance')")));
else if(page==="attendance")frame("Registrar presença","Grupo A • participantes ilustrativos.",'<div class="card">'+["Marina Costa","João Oliveira","Ana Martins","Carlos Lima"].map(n=>'<div class="person"><label><input type="checkbox" style="width:auto;display:inline;margin:0 12px 0 0">'+n+'</label></div>').join("")+'<p>'+button("Salvar presenças","simulated('Registro')")+'</p></div>');
else if(page==="notices")frame("Gerenciar avisos","Crie comunicados para os participantes.",demoForm("Novo aviso",["Título","Mensagem"])+notices.map(n=>card("Aviso publicado",n)).join(""));
else frame("Envio de e-mails","Uma integração externa será necessária para envios reais.",'<div class="card"><label>Destinatários</label><select><option>Todos os alunos ativos</option><option>Sem login recente</option><option>Acesso expirado</option></select><label>Assunto</label><input><label>Mensagem</label><textarea></textarea>'+button("Simular envio","simulated('E-mail')")+'</div>');
}}
function toggle(i){booked.has(i)?booked.delete(i):booked.add(i);render()}render();
</script>
</body></html>
